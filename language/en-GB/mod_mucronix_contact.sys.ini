MOD_MUCRONIX_CONTACT_LAYOUT_DEFAULT="Default"
MOD_MUCRONIX_CONTACT="Mucronix Contact Lite"
MOD_MUCRONIX_CONTACT_XML_DESCRIPTION="Shows a contact form on the page. The message is sent to the site owner by email, without reloading the page. Telegram, extra fields, attachments and the full set of appearance settings are in <a href='https://mucronix.com/products/joomla/mucronix-contact' target='_blank' rel='noopener'>Mucronix Contact Pro</a>."
MOD_MUCRONIX_CONTACT_INSTALL_OVER_PRO="Mucronix Contact Lite has been installed over Mucronix Contact Pro. The forms keep working, with what Lite has. The settings of Pro stay stored until a module of this type is next saved, and are dropped at that moment; the files only Pro uses have been removed. To go back, install Pro again before saving the modules."
