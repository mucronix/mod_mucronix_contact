MOD_MUCRONIX_CONTACT_FIELD_CONSENT_ARTICLE_DESC="The article holding your privacy policy. Choosing one turns the whole consent wording into a link to that article, opening in a new tab so that nothing already typed into the form is lost. Leave empty and the wording stays plain text with no link."
