MOD_MUCRONIX_CONTACT_FIELD_FORM_INTRO_DESC="Text shown above the form. HTML is allowed. The module has no heading field of its own on purpose, because Joomla already gives every module a title with its own tag and class; if you hide that title and still want a heading, put it here."
