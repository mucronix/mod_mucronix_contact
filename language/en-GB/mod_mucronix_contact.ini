MOD_MUCRONIX_CONTACT_FIELD_FIELD_CLASS_DESC="Classes for the box around every field, the one that also carries that field's error message. Use it to take the spacing from your own template, for example mb-3 on Bootstrap or uk-margin on YOOtheme. The hidden trap field is left out on purpose: a class of your own could bring it back into view."
MOD_MUCRONIX_CONTACT_FIELD_SUBJECT_DESC="Subject of the message. Leave empty to use: Message from the site name."
