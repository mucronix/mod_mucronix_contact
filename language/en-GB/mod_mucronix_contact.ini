MOD_MUCRONIX_CONTACT_PAGE_CACHE_ON="The Page Cache plugin is switched on, and it hands whole pages to visitors who are not logged in. Two things go wrong on a page carrying this form, and neither shows anywhere. One: the form token is stored along with the page, so every guest after the first is sent somebody else's token and the form refuses to send - reloading brings back the same stored page with the same token. Two, and less obvious: once a message has been sent without JavaScript, the page that says thank you is stored in turn, and from then on guests are shown that thank you instead of the form. Put the page in Exclude Menu Items or Exclude URLs in the plugin settings. Ignore this if no visitor can reach this form without logging in: the plugin leaves those pages alone. Only people who can manage modules see this notice."
MOD_MUCRONIX_CONTACT_MAIL_ATTACHMENT="Attached file"
MOD_MUCRONIX_CONTACT_MAIL_DATE="Date"
MOD_MUCRONIX_CONTACT_MAIL_PAGE="Page"
MOD_MUCRONIX_CONTACT_MAIL_SUBJECT="Message from %s"
MOD_MUCRONIX_CONTACT_MESSAGE_SUCCESS="Thank you! Your message has been sent."
MOD_MUCRONIX_CONTACT_XML_DESCRIPTION="Shows a contact form on the page. The message is sent to the site owner by email and, optionally, to Telegram, without reloading the page."
MOD_MUCRONIX_CONTACT_FIELDSET_EXTRAFIELDS_LABEL="Extra Fields"
MOD_MUCRONIX_CONTACT_FIELD_EXTRA_FIELDS_LABEL="Field Description"
MOD_MUCRONIX_CONTACT_FIELD_EXTRA_FIELDS_DESC="Fields in the Joomla form format, added in front of the captcha and written into the message. Example: &lt;field name="phone" type="tel" label="Phone" /&gt;. Allowed types: text, textarea, email, tel, url, number, list, radio, checkbox, checkboxes, calendar. A name must start with a letter and hold letters, digits and underscores only, and the names the module uses itself are refused. Anything skipped is named in a notice above the form, visible only to people who can manage modules. See https://docs.joomla.org/Form_field"
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_BROKEN="Extra fields: the description could not be read, so no field was added. %s Only people who can manage modules see this notice."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_XML_ERROR="Line %1$d: %2$s"
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_XML_ERROR_UNKNOWN="The reason was not reported."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_EMPTY="Extra fields: the description holds no field element, so nothing was added. Only people who can manage modules see this notice."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_NO_NAME="Extra fields: a field without a name was skipped. Only people who can manage modules see this notice."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_BAD_NAME="Extra fields: the name %s was refused and the field skipped. A name has to start with a letter and may hold letters, digits and underscores only: anything else can end up sharing an id with another field, and then one of the two disappears from the page. Only people who can manage modules see this notice."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_RESERVED="Extra fields: the name %s belongs to the module and the field was skipped. Taking it over would replace the field of the module, and with captcha or mcx_hp that means the form loses a protection without showing it. Only people who can manage modules see this notice."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_DUPLICATE="Extra fields: the name %s is used more than once, only the first field was kept. Only people who can manage modules see this notice."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_NO_TYPE="Extra fields: the field %s has no type and was skipped. Only people who can manage modules see this notice."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_BAD_TYPE="Extra fields: the field %1$s was skipped, the type %2$s is not accepted here. Allowed: %3$s. Only people who can manage modules see this notice."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_ATTRIBUTE_DROPPED="Extra fields: the attribute %2$s was removed from the field %1$s. It can push a field of the module off the page or point the field at a file of its own. Only people who can manage modules see this notice."
MOD_MUCRONIX_CONTACT_ERROR_FIELD_INVALID="This value is not accepted."
MOD_MUCRONIX_CONTACT_FIELDSET_TELEGRAM_LABEL="Telegram"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_ENABLED_LABEL="Send to Telegram"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_ENABLED_DESC="Sends a copy of every message to a Telegram chat. The email is sent first and is never held up by this: if Telegram refuses or does not answer, the visitor still sees the message go through and the reason is written to the module log."
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_TOKEN_LABEL="Bot Token"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_TOKEN_DESC="The token BotFather gives you, in the form 123456789:AA... . It is stored in the database as plain text and stands in the page source of these settings for anyone who can open this module for editing, the same way Joomla keeps the SMTP and database passwords. Give the bot access to the one chat it needs and nothing more, and revoke the token in BotFather if it ever gets out."
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_CHAT_ID_LABEL="Chat ID"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_CHAT_ID_DESC="Where the message goes: a number for a private chat or a group, or @name for a public channel. The bot has to be a member of that chat already."
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_INTRO_LABEL="Intro Line"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_INTRO_DESC="Goes out as the first line of the Telegram message, ahead of the form fields. One bot can serve several forms or several sites and nothing else tells the messages apart: an email has its subject, a chat has nothing. Leave it empty and the message starts with the fields, with no blank line in front."
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_ATTACH_LABEL="Send the Attachment Too"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_ATTACH_DESC="Sends the attached file to the chat as a second request, images as a photo and everything else as a file. Telegram accepts at most 10 MB for a photo and 50 MB for a file."
MOD_MUCRONIX_CONTACT_TELEGRAM_TRUNCATED=" […]"
MOD_MUCRONIX_CONTACT_TELEGRAM_INCOMPLETE="Sending to Telegram is switched on, but this is not filled in: %s. Nothing is sent to the chat until it is. Only people who can manage modules see this notice."
MOD_MUCRONIX_CONTACT_SUCCESS_PAGE_GONE="Thank You Page: the menu item chosen for it, id %s, is deleted, unpublished or outside its publishing dates, so everyone who sends a message is dropped on the front page. The message itself still goes out, which is why nothing about this looks broken. Only people who can manage modules see this notice."
MOD_MUCRONIX_CONTACT_SUCCESS_PAGE_NO_PAGE="Thank You Page: the menu item %1$s is of the type %2$s, which has no page of its own to route to, so everyone who sends a message is dropped on the front page. Choose a menu item that opens a page. Only people who can manage modules see this notice."
MOD_MUCRONIX_CONTACT_SUCCESS_PAGE_CLOSED="Thank You Page: the menu item %1$s is open to %2$s only, so a visitor who is not logged in meets the login form once the message has gone out. Ignore this if nobody can reach this form without logging in. Only people who can manage modules see this notice."
