MOD_MUCRONIX_CONTACT_FIELD_SUBMIT_TEXT_DESC="Wording on the send button. Leave empty for the standard wording."
MOD_MUCRONIX_CONTACT_FIELD_SUBMIT_TEXT_LABEL="Button Text"
MOD_MUCRONIX_CONTACT_FIELD_SUCCESS_PAGE_DESC="Where the visitor goes the moment the message has gone out, with or without JavaScript. No message is shown first: the page itself is the thank you, and an analytics goal on it counts a real page view. The Success Message above is then never seen. A page is held by its menu item rather than by its address, so renaming its alias cannot break this."
MOD_MUCRONIX_CONTACT_FIELD_SUCCESS_PAGE_LABEL="Thank You Page"
MOD_MUCRONIX_CONTACT_FIELD_SUCCESS_PAGE_NONE="Stay on this page"
MOD_MUCRONIX_CONTACT_FIELD_SUCCESS_TEXT_DESC="Shown in place of the form once the message has gone out. Leave empty for the standard wording. Not used when a Thank You Page is chosen below, because the visitor is taken there instead."
