MOD_MUCRONIX_CONTACT_FIELD_CAPTCHA_DESC="Какая CAPTCHA защищает эту форму. «По умолчанию» следует за настройкой сайта; без CAPTCHA форму можно отправить и с выключенным JavaScript."
MOD_MUCRONIX_CONTACT_FIELD_CAPTCHA_LABEL="CAPTCHA"
MOD_MUCRONIX_CONTACT_FIELD_CONSENT_ARTICLE_DESC="Материал с вашей политикой конфиденциальности. Если выбрать его, весь текст согласия становится ссылкой на этот материал и открывается в новой вкладке, чтобы уже введённое в форму не потерялось. Пусто — текст остаётся обычным, без ссылки."
MOD_MUCRONIX_CONTACT_FIELD_CONSENT_ARTICLE_LABEL="Материал с политикой"
MOD_MUCRONIX_CONTACT_FIELD_CONSENT_TEXT_DESC="Текст рядом с чекбоксом. Пусто — обычная фраза модуля. Это простой текст, не HTML: чтобы он стал ссылкой, выберите материал с политикой выше — он и превращает этот текст в ссылку."
MOD_MUCRONIX_CONTACT_FIELD_CONSENT_TEXT_LABEL="Текст согласия"
MOD_MUCRONIX_CONTACT_FIELD_FORM_CLASS_DESC="Классы самой формы, внутри обёртки. Нужны редко: блок вокруг формы оформляется параметром «Класс обёртки» выше, и в большинстве шаблонов достаточно его."
MOD_MUCRONIX_CONTACT_FIELD_FORM_CLASS_LABEL="Класс формы"
MOD_MUCRONIX_CONTACT_FIELD_FORM_INTRO_DESC="Текст над формой, допускается HTML. Своего поля заголовка у модуля нет намеренно: Joomla уже даёт каждому модулю заголовок с выбором тега и класса. Если штатный заголовок скрыт, а заголовок нужен, поместите его сюда."
MOD_MUCRONIX_CONTACT_FIELD_FORM_INTRO_LABEL="Вводный текст"
MOD_MUCRONIX_CONTACT_FIELD_LOAD_CSS_DESC="Подключает небольшой файл стилей модуля: отступы между полями, ширина полей, чекбокс согласия, подсветка ошибок и блок сообщения. Карточку, фон, рамку и тень вокруг формы он не рисует — они приходят из вашего шаблона через «Класс обёртки» ниже. Выключите, если шаблон оформляет формы сам."
MOD_MUCRONIX_CONTACT_FIELD_LOAD_CSS_LABEL="Подключать CSS модуля"
MOD_MUCRONIX_CONTACT_FIELD_LOG_SENT_DESC="Пишет строку на каждое отправленное сообщение в administrator/logs/mod_mucronix_contact.php. Ошибки пишутся в любом случае. Если вы не проверяете модуль, держите выключенным: такой журнал растёт без предела и накапливает данные о том, кто и когда писал."
MOD_MUCRONIX_CONTACT_FIELD_LOG_SENT_LABEL="Вести журнал отправленных"
MOD_MUCRONIX_CONTACT_FIELD_RECIPIENT_DESC="Адрес, на который уходят сообщения. Пусто — берётся e-mail сайта."
MOD_MUCRONIX_CONTACT_FIELD_RECIPIENT_EXTRA_DESC="Дополнительные получатели, по одному адресу в строке."
