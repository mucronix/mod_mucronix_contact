MOD_MUCRONIX_CONTACT_PAGE_CACHE_ON="Включён плагин «Кеш страниц», а он отдаёт целые страницы посетителям, не вошедшим на сайт. На странице с этой формой ломаются две вещи, и ни одна из них никак себя не проявляет. Первая: вместе со страницей сохраняется токен формы, поэтому каждый гость после первого получает чужой токен и форма отказывается отправляться — обновление страницы возвращает ту же сохранённую копию с тем же токеном. Вторая, менее очевидная: после отправки без JavaScript в кеш попадает уже страница с благодарностью, и дальше гостям вместо формы показывается она. Внесите страницу в «Исключить пункты меню» или «Исключить URL-адреса» в настройках плагина. Если без входа на сайт до этой формы не добраться, сообщение можно не учитывать: такие страницы плагин не трогает. Это сообщение видят только те, кто может управлять модулями."
