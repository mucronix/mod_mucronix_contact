MOD_MUCRONIX_CONTACT_FIELD_SHOW_NAME_LABEL="Поле «Имя»"
MOD_MUCRONIX_CONTACT_FIELD_SUBMIT_CLASS_DESC="Классы кнопки отправки, например btn btn-primary для шаблонов на Bootstrap или uk-button uk-button-primary для YOOtheme."
MOD_MUCRONIX_CONTACT_FIELD_SUBMIT_CLASS_LABEL="Класс кнопки"
MOD_MUCRONIX_CONTACT_FIELD_SUBJECT_DESC="Тема письма. Пусто — «Сообщение с сайта {название}»."
MOD_MUCRONIX_CONTACT_FIELD_SUBJECT_LABEL="Тема"
MOD_MUCRONIX_CONTACT_FIELD_SUBMIT_TEXT_DESC="Надпись на кнопке отправки. Пусто — обычная надпись модуля."
MOD_MUCRONIX_CONTACT_FIELD_SUBMIT_TEXT_LABEL="Надпись на кнопке"
MOD_MUCRONIX_CONTACT_FIELD_SUCCESS_PAGE_DESC="Куда посетитель попадёт сразу после того, как сообщение ушло, — с JavaScript и без него. Сообщение при этом не показывается: страница и есть благодарность, а цель в аналитике на ней засчитывает настоящий просмотр. «Сообщение об успехе» выше тогда не увидят никогда. Страница держится пунктом меню, а не адресом, поэтому смена алиаса ничего не ломает."
MOD_MUCRONIX_CONTACT_FIELD_SUCCESS_PAGE_LABEL="Страница благодарности"
MOD_MUCRONIX_CONTACT_FIELD_SUCCESS_PAGE_NONE="Остаться на этой странице"
MOD_MUCRONIX_CONTACT_FIELD_SUCCESS_TEXT_DESC="Показывается вместо формы, когда сообщение ушло. Пусто — обычный текст модуля. Не используется, если ниже выбрана страница благодарности: посетитель уходит туда."
MOD_MUCRONIX_CONTACT_FIELD_SUCCESS_TEXT_LABEL="Сообщение об успехе"
MOD_MUCRONIX_CONTACT_FIELD_WRAPPER_CLASS_DESC="Классы блока вокруг формы, например card p-4 shadow-sm для шаблонов на Bootstrap или uk-card uk-card-default uk-box-shadow-medium для YOOtheme."
MOD_MUCRONIX_CONTACT_FIELD_WRAPPER_CLASS_LABEL="Класс обёртки"
MOD_MUCRONIX_CONTACT_FORM_ATTACHMENT_DESC="Если в форме придётся что-то поправить, файл нужно будет выбрать заново: браузер никогда не заполняет поле файла повторно."
