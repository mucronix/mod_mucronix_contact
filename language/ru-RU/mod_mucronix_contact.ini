MOD_MUCRONIX_CONTACT_MAIL_SUBJECT="Сообщение с сайта %s"
MOD_MUCRONIX_CONTACT_MESSAGE_SUCCESS="Спасибо! Ваше сообщение отправлено."
MOD_MUCRONIX_CONTACT_XML_DESCRIPTION="Выводит на странице форму обратной связи. Сообщение уходит владельцу сайта на почту и, при желании, в Telegram, без перезагрузки страницы."
MOD_MUCRONIX_CONTACT_FIELDSET_EXTRAFIELDS_LABEL="Дополнительные поля"
MOD_MUCRONIX_CONTACT_FIELD_EXTRA_FIELDS_LABEL="Описание полей"
MOD_MUCRONIX_CONTACT_FIELD_EXTRA_FIELDS_DESC="Поля в формате форм Joomla. Встают перед CAPTCHA и попадают в письмо. Пример: &lt;field name=&quot;phone&quot; type=&quot;tel&quot; label=&quot;Phone&quot; /&gt;. Допустимые типы: text, textarea, email, tel, url, number, list, radio, checkbox, checkboxes, calendar. Имя должно начинаться с буквы и содержать только буквы, цифры и подчёркивания; имена, занятые самим модулем, отклоняются. Обо всём пропущенном сказано в сообщении над формой, которое видят только те, кто может управлять модулями. См. https://docs.joomla.org/Form_field"
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_BROKEN="Дополнительные поля: описание не удалось разобрать, поэтому ни одно поле не добавлено. %s Это сообщение видят только те, кто может управлять модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_XML_ERROR="Строка %1$d: %2$s"
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_XML_ERROR_UNKNOWN="Причина не названа."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_EMPTY="Дополнительные поля: в описании нет ни одного элемента field, поэтому ничего не добавлено. Это сообщение видят только те, кто может управлять модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_NO_NAME="Дополнительные поля: поле без имени пропущено. Это сообщение видят только те, кто может управлять модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_BAD_NAME="Дополнительные поля: имя %s отклонено, поле пропущено. Имя должно начинаться с буквы и может содержать только буквы, цифры и подчёркивания: при других знаках у двух полей получается один id, и одно из них молча исчезает со страницы. Это сообщение видят только те, кто может управлять модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_RESERVED="Дополнительные поля: имя %s занято модулем, поле пропущено. Заняв его, вы заменили бы поле модуля, а для captcha или mcx_hp это значит, что форма теряет защиту, никак этого не показывая. Это сообщение видят только те, кто может управлять модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_DUPLICATE="Дополнительные поля: имя %s встречается несколько раз, оставлено только первое поле. Это сообщение видят только те, кто может управлять модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_NO_TYPE="Дополнительные поля: у поля %s нет типа, оно пропущено. Это сообщение видят только те, кто может управлять модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_BAD_TYPE="Дополнительные поля: поле %1$s пропущено, тип %2$s здесь не принимается. Допустимы: %3$s. Это сообщение видят только те, кто может управлять модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_ATTRIBUTE_DROPPED="Дополнительные поля: у поля %1$s удалён атрибут %2$s. Он может выбить поле модуля со страницы или направить поле на посторонний файл. Это сообщение видят только те, кто может управлять модулями."
MOD_MUCRONIX_CONTACT_ERROR_FIELD_INVALID="Такое значение не принимается."
MOD_MUCRONIX_CONTACT_FIELDSET_TELEGRAM_LABEL="Telegram"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_ENABLED_LABEL="Отправлять в Telegram"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_ENABLED_DESC="Отправляет копию каждого сообщения в чат Telegram. Письмо уходит первым и этим никогда не задерживается: если Telegram откажет или не ответит, посетитель всё равно увидит, что сообщение прошло, а причина уйдёт в журнал модуля."
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_TOKEN_LABEL="Токен бота"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_TOKEN_DESC="Токен, который выдаёт BotFather, вида 123456789:AA... . В базе он лежит открытым текстом и виден в исходном коде этой страницы настроек всякому, кто открыл модуль на правку, — так же Joomla хранит пароли SMTP и базы данных. Дайте боту доступ только к тому чату, который нужен, и отзовите токен в BotFather, если он куда-то утёк."
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_CHAT_ID_LABEL="ID чата"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_CHAT_ID_DESC="Куда уходит сообщение: число для личного чата или группы либо @имя для публичного канала. Бот уже должен состоять в этом чате."
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_ATTACH_LABEL="Отправлять и вложение"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_ATTACH_DESC="Отправляет вложенный файл в чат вторым запросом: изображения — картинкой, остальное — файлом. Telegram принимает не больше 10 МБ для картинки и 50 МБ для файла."
MOD_MUCRONIX_CONTACT_TELEGRAM_TRUNCATED=" […]"
MOD_MUCRONIX_CONTACT_TELEGRAM_INCOMPLETE="Отправка в Telegram включена, но не заполнено: %s. Пока это не заполнено, в чат ничего не уходит. Это сообщение видят только те, кто может управлять модулями."
MOD_MUCRONIX_CONTACT_SUCCESS_PAGE_GONE="Страница благодарности: выбранный для неё пункт меню (id %s) удалён, снят с публикации или вышел из дат публикации, поэтому каждый, кто отправит сообщение, попадёт на главную страницу. Само сообщение при этом уходит — потому и не похоже, что что-то сломано. Это сообщение видят только те, кто может управлять модулями."
MOD_MUCRONIX_CONTACT_SUCCESS_PAGE_NO_PAGE="Страница благодарности: пункт меню %1$s имеет тип %2$s, у которого нет своей страницы, поэтому каждый, кто отправит сообщение, попадёт на главную страницу. Выберите пункт меню, открывающий страницу. Это сообщение видят только те, кто может управлять модулями."
MOD_MUCRONIX_CONTACT_SUCCESS_PAGE_CLOSED="Страница благодарности: пункт меню %1$s открыт только для уровня доступа «%2$s», поэтому посетитель без входа на сайт попадёт на форму входа, как только сообщение уйдёт. Если без входа до этой формы не добраться, сообщение можно не учитывать. Это сообщение видят только те, кто может управлять модулями."
