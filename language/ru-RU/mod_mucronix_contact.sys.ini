MOD_MUCRONIX_CONTACT_XML_DESCRIPTION="Выводит на странице форму обратной связи. Сообщение уходит владельцу сайта на почту, без перезагрузки страницы. Telegram, дополнительные поля, вложения и полный набор параметров оформления — в <a href='https://mucronix.com/products/joomla/mucronix-contact' target='_blank' rel='noopener'>Mucronix Contact Pro</a>."
