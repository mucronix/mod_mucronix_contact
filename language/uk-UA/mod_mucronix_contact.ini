MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_EMPTY="Додаткові поля: в описі немає жодного елемента field, тому нічого не додано. Це повідомлення бачать лише ті, хто може керувати модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_NO_NAME="Додаткові поля: поле без імені пропущено. Це повідомлення бачать лише ті, хто може керувати модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_BAD_NAME="Додаткові поля: ім'я %s відхилено, поле пропущено. Ім'я має починатися з літери й може містити лише літери, цифри та підкреслення: за інших знаків у двох полів виходить один id, і одне з них мовчки зникає зі сторінки. Це повідомлення бачать лише ті, хто може керувати модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_RESERVED="Додаткові поля: ім'я %s зайняте модулем, поле пропущено. Зайнявши його, ви замінили б поле модуля, а для captcha або mcx_hp це означає, що форма втрачає захист, ніяк цього не показуючи. Це повідомлення бачать лише ті, хто може керувати модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_DUPLICATE="Додаткові поля: ім'я %s трапляється кілька разів, залишено лише перше поле. Це повідомлення бачать лише ті, хто може керувати модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_NO_TYPE="Додаткові поля: у поля %s немає типу, його пропущено. Це повідомлення бачать лише ті, хто може керувати модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_BAD_TYPE="Додаткові поля: поле %1$s пропущено, тип %2$s тут не приймається. Дозволені: %3$s. Це повідомлення бачать лише ті, хто може керувати модулями."
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_ATTRIBUTE_DROPPED="Додаткові поля: у поля %1$s вилучено атрибут %2$s. Він може виштовхнути поле модуля зі сторінки або спрямувати поле на сторонній файл. Це повідомлення бачать лише ті, хто може керувати модулями."
MOD_MUCRONIX_CONTACT_ERROR_FIELD_INVALID="Таке значення не приймається."
MOD_MUCRONIX_CONTACT_FIELDSET_TELEGRAM_LABEL="Telegram"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_ENABLED_LABEL="Надсилати в Telegram"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_ENABLED_DESC="Надсилає копію кожного повідомлення в чат Telegram. Лист надсилається першим і ніколи цим не затримується: якщо Telegram відмовить або не відповість, відвідувач усе одно побачить, що повідомлення пройшло, а причина потрапить до журналу модуля."
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_TOKEN_LABEL="Токен бота"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_TOKEN_DESC="Токен, який видає BotFather, виду 123456789:AA... . У базі він зберігається відкритим текстом і його видно у вихідному коді цієї сторінки налаштувань кожному, хто відкрив модуль на редагування, — так само Joomla зберігає паролі SMTP і бази даних. Дайте боту доступ лише до того чату, який потрібен, і відкличте токен у BotFather, якщо він кудись витік."
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_CHAT_ID_LABEL="ID чату"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_CHAT_ID_DESC="Куди надходить повідомлення: число для особистого чату чи групи або @ім'я для публічного каналу. Бот уже має бути в цьому чаті."
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_INTRO_LABEL="Вступний рядок"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_INTRO_DESC="Вирушає першим рядком повідомлення в Telegram, перед полями форми. Один бот може обслуговувати кілька форм або кілька сайтів, і розрізнити повідомлення більше нічим: у листа є тема, у чата — нічого. Порожньо — повідомлення починається одразу з полів, без порожнього рядка на початку."
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_ATTACH_LABEL="Надсилати й вкладення"
MOD_MUCRONIX_CONTACT_FIELD_TELEGRAM_ATTACH_DESC="Надсилає вкладений файл у чат другим запитом: зображення — картинкою, решту — файлом. Telegram приймає не більше 10 МБ для картинки і 50 МБ для файлу."
MOD_MUCRONIX_CONTACT_TELEGRAM_TRUNCATED=" […]"
MOD_MUCRONIX_CONTACT_TELEGRAM_INCOMPLETE="Надсилання в Telegram увімкнено, але не заповнено: %s. Поки це не заповнено, у чат нічого не надсилається. Це повідомлення бачать лише ті, хто може керувати модулями."
MOD_MUCRONIX_CONTACT_SUCCESS_PAGE_GONE="Сторінка подяки: обраний для неї пункт меню (id %s) видалено, знято з публікації або він вийшов із дат публікації, тому кожен, хто надішле повідомлення, потрапить на головну сторінку. Саме повідомлення водночас надсилається — тому й не схоже, що щось зламано. Це повідомлення бачать лише ті, хто може керувати модулями."
MOD_MUCRONIX_CONTACT_SUCCESS_PAGE_NO_PAGE="Сторінка подяки: пункт меню %1$s має тип %2$s, у якого немає своєї сторінки, тому кожен, хто надішле повідомлення, потрапить на головну сторінку. Оберіть пункт меню, що відкриває сторінку. Це повідомлення бачать лише ті, хто може керувати модулями."
MOD_MUCRONIX_CONTACT_SUCCESS_PAGE_CLOSED="Сторінка подяки: пункт меню %1$s відкритий лише для рівня доступу «%2$s», тому відвідувач без входу на сайт потрапить на форму входу, щойно повідомлення буде надіслано. Якщо без входу до цієї форми не дістатися, повідомлення можна не враховувати. Це повідомлення бачать лише ті, хто може керувати модулями."
