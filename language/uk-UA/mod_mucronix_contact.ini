MOD_MUCRONIX_CONTACT_XML_DESCRIPTION="Виводить на сторінці форму зворотного зв'язку. Повідомлення надсилається власникові сайту на пошту, без перезавантаження сторінки. Telegram, додаткові поля, вкладення та повний набір параметрів оформлення — у <a href='https://mucronix.com/products/joomla/mucronix-contact' target='_blank' rel='noopener'>Mucronix Contact Pro</a>."
