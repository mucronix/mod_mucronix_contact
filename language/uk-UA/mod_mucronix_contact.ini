MOD_MUCRONIX_CONTACT_PAGE_CACHE_ON="Увімкнено плагін «Кеш сторінок», а він віддає цілі сторінки відвідувачам, які не увійшли на сайт. На сторінці з цією формою ламаються дві речі, і жодна з них ніяк себе не виявляє. Перша: разом зі сторінкою зберігається токен форми, тому кожен гість після першого отримує чужий токен і форма відмовляється надсилатися — оновлення сторінки повертає ту саму збережену копію з тим самим токеном. Друга, менш очевидна: після надсилання без JavaScript до кешу потрапляє вже сторінка з подякою, і далі гостям замість форми показується вона. Внесіть сторінку до «Виключити пункти меню» або «Виключити URL-адреси» в налаштуваннях плагіна. Якщо без входу на сайт до цієї форми не дістатися, повідомлення можна не враховувати: такі сторінки плагін не чіпає. Це повідомлення бачать лише ті, хто може керувати модулями."
