MOD_MUCRONIX_CONTACT_FIELDSET_EXTRAFIELDS_LABEL="Додаткові поля"
MOD_MUCRONIX_CONTACT_FIELD_EXTRA_FIELDS_LABEL="Опис полів"
MOD_MUCRONIX_CONTACT_FIELD_EXTRA_FIELDS_DESC="Поля у форматі форм Joomla. Стають перед CAPTCHA і потрапляють до листа. Приклад: &lt;field name=&quot;phone&quot; type=&quot;tel&quot; label=&quot;Phone&quot; /&gt;. Дозволені типи: text, textarea, email, tel, url, number, list, radio, checkbox, checkboxes, calendar. Ім'я має починатися з літери й містити лише літери, цифри та підкреслення; імена, зайняті самим модулем, відхиляються. Про все пропущене сказано в повідомленні над формою, яке бачать лише ті, хто може керувати модулями. Див. https://docs.joomla.org/Form_field"
MOD_MUCRONIX_CONTACT_EXTRA_FIELDS_BROKEN="Додаткові поля: опис не вдалося розібрати, тому жодного поля не додано. %s Це повідомлення бачать лише ті, хто може керувати модулями."
